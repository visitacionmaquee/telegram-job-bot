global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # JobRadar AI FastAPI Backend Telemetry
  - job_name: "jobradar_api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: "jobradar-ai"
          environment: "production"
